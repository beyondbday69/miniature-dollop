name: Flutter Build APK

on:
  push:
    branches:
      - main
    paths:
      - 'VOXLINK_MOBILE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Regenerate Android project structure
        run: |
          cd VOXLINK_MOBILE
          mkdir -p /tmp/backup/lib
          cp -r lib/* /tmp/backup/lib/ 2>/dev/null || true
          cp pubspec.yaml /tmp/backup/ 2>/dev/null || true
          cp -r assets /tmp/backup/ 2>/dev/null || true
          rm -rf android
          flutter create --platforms android --project-name voxlink_mobile .
          cp -r /tmp/backup/lib/* lib/ 2>/dev/null || true
          cp /tmp/backup/pubspec.yaml . 2>/dev/null || true
          cp -r /tmp/backup/assets . 2>/dev/null || true

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > VOXLINK_MOBILE/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> VOXLINK_MOBILE/android/local.properties

      - name: Fix settings.gradle
        run: |
          cat > VOXLINK_MOBILE/android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.7.0" apply false
              id "org.jetbrains.kotlin.android" version "1.8.22" apply false
          }

          include ":app"
          EOF

      - name: Fix AndroidManifest permissions
        run: |
          MANIFEST=VOXLINK_MOBILE/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"

      - name: Install dependencies
        run: |
          cd VOXLINK_MOBILE
          flutter pub get

      - name: Build APK
        run: |
          cd VOXLINK_MOBILE
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voxlink-release-apk
          path: VOXLINK_MOBILE/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: VOXLINK_MOBILE/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: Release v1.0.0-${{ github.run_number }}
          body: Automated build of VoxLink Mobile APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
